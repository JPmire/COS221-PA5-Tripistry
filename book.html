<!DOCTYPE html>
<html lang="en">
<head>
    <title>Book & Review - Tripistry</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h2>Book Package</h2>
    <form id="bookForm">
        <input type="number" id="packageId" placeholder="Package ID" required>
        <input type="number" id="tripDateId" placeholder="Trip Date ID" required>
        <input type="number" id="partySize" placeholder="Party Size" required>
        <button type="submit">Book Now</button>
    </form>

    <h2>Leave a Review</h2>
    <form id="reviewForm">
        <select id="reviewType">
            <option value="agency">Review an Agency</option>
            <option value="package">Review a Package</option>
        </select>
        <input type="number" id="targetId" placeholder="Enter Agency ID or Package ID" required>
        <input type="number" id="rating" placeholder="Rating (1-5)" min="1" max="5" required>
        <textarea id="comment" placeholder="Your comment" required></textarea>
        <button type="submit">Submit Review</button>
    </form>

    <script src="app.js"></script>
</body>
</html>
