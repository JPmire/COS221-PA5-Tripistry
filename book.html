<!DOCTYPE html>
<html lang="en">
<head>
    <title>Book & Review - Tripistry</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h2>Book a Travel Package</h2>
    <div class="form-container">
        <form id="bookForm">
            <div class="form-group">
                <label>Select Package:</label>
                <select id="packageSelect" required>
                    <option value="">-- Loading Packages... --</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Select Trip Date:</label>
                <!-- Disabled until a package is chosen -->
                <select id="tripDateSelect" required disabled>
                    <option value="">-- Please select a package first --</option>
                </select>
            </div>

            <div class="form-group">
                <label>Party Size (Number of people):</label>
                <input type="number" id="partySize" min="1" value="1" required>
            </div>
            
            <button type="submit">Confirm Booking</button>
        </form>
    </div>

    <!-- ... Keep your review form below ... -->

    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>
